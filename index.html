<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Examen · Vistas y escalas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+Arabic:wght@500;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--navy:#1e3a8a;--blue:#2563eb;--bg:#eef2f7;--card:#fff;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--ok:#16a34a;--ko:#dc2626;--warn:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito','Noto Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.55;-webkit-user-select:none;user-select:none}
html[dir=rtl] body{font-family:'Noto Sans Arabic','Nunito',system-ui,sans-serif;line-height:1.8}
input{-webkit-user-select:text;user-select:text}
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .t{font-weight:900;font-size:16px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-weight:900;font-size:16px;direction:ltr;unicode-bidi:isolate}
.chip.exit{background:#fee2e2;color:#991b1b}
.tb{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:3px 12px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.tb.on{background:#fff;color:var(--navy)}
main{max-width:900px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(15,23,42,.06)}
h1{font-size:30px;line-height:1.2;margin:0 0 10px;color:var(--navy)}
h2{font-size:23px;margin:0 0 10px;line-height:1.3}
strong{color:var(--navy);background:linear-gradient(transparent 58%,#fde68a 58%);padding:0 1px}
.es{unicode-bidi:isolate;direction:ltr;color:#1e3a8a;font-weight:700}
.btn{border:none;border-radius:14px;padding:11px 22px;font:inherit;font-weight:900;cursor:pointer;background:var(--blue);color:#fff;font-size:19px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.green{background:var(--ok)}
.btn .es{color:inherit}
label.f{display:block;font-weight:800;margin:10px 0 4px}
input.txt{width:100%;max-width:460px;font:inherit;font-size:19px;padding:9px 14px;border:2px solid var(--line);border-radius:12px}
ul.rules{padding-inline-start:22px;margin:8px 0}
ul.rules li{margin:5px 0}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;direction:ltr}
.qnav button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:900;cursor:pointer}
.qnav button.done{background:#dbeafe;border-color:#93c5fd}
.qnav button.cur{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.tag{display:inline-block;font-size:14px;font-weight:900;padding:2px 10px;border-radius:999px;background:#e0e7ff;color:var(--navy);margin-bottom:6px}
.stage{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center;margin:8px 0 12px}
.iso{width:230px;max-width:70vw;background:#f8fafc;border:2px solid var(--line);border-radius:16px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px;cursor:pointer;font:inherit;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt svg{width:100%;height:auto;max-width:150px}
.opt.sel{border-color:var(--blue);background:#dbeafe}
.opt .l{font-size:18px;color:var(--navy)}
.tx-opts{display:flex;flex-wrap:wrap;gap:10px}
.tx-opts .opt{flex-direction:row;padding:10px 18px}
.views3{display:grid;grid-template-columns:repeat(2,140px);gap:10px 14px;direction:ltr}
.views3 div{text-align:center;font-size:13px;font-weight:900;color:var(--muted)}
.views3 svg{width:140px;height:140px;background:#fff;border:2px solid var(--line);border-radius:10px}
.numans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.numans input{width:160px;font:inherit;font-weight:900;font-size:22px;padding:8px 12px;border:3px solid var(--line);border-radius:12px;text-align:center;direction:ltr}
.numans .u{font-weight:900;font-size:20px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.warnbar{position:fixed;inset:auto 0 0 0;z-index:60;background:#991b1b;color:#fff;font-weight:900;text-align:center;padding:12px;font-size:18px}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.88);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:520px;text-align:center}
/* calculadora */
#calc{position:fixed;z-index:70;top:62px;inset-inline-end:14px;width:250px;background:#0f172a;border-radius:18px;padding:12px;box-shadow:0 14px 34px rgba(0,0,0,.35);direction:ltr}
#cdisp{background:#e2e8f0;border-radius:10px;padding:8px 10px;text-align:right;font-weight:900;font-size:24px;min-height:44px;overflow:hidden;white-space:nowrap}
#cexpr{color:#94a3b8;font-size:13px;text-align:right;min-height:18px;margin-bottom:4px;overflow:hidden;white-space:nowrap}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.ck button{border:none;border-radius:10px;padding:11px 0;font:inherit;font-weight:900;font-size:19px;cursor:pointer;background:#334155;color:#fff}
.ck button.op{background:#2563eb}.ck button.eq{background:#16a34a}.ck button.cl{background:#b91c1c}
.res-grade{font-size:56px;font-weight:900;color:var(--navy);text-align:center;direction:ltr}
table{border-collapse:collapse;width:100%}
td,th{border:2px solid var(--line);padding:7px 9px;text-align:center}
th{background:#e0e7ff;color:var(--navy)}
td.l{text-align:start;font-weight:800}
.ok{color:var(--ok);font-weight:900}.ko{color:var(--ko);font-weight:900}
.small{font-size:15px;color:var(--muted)}
@media print{.top,.nav,#bPdf,#pdfBox,.small,#calc,.warnbar{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <span class="t" data-i="hdr"></span>
  <div class="chips">
    <span class="chip" id="timer" hidden>⏱ 00:00</span>
    <span class="chip exit" id="exitsChip" hidden></span>
    <button class="tb" id="calcBtn" hidden>🧮 <span data-i="calc"></span></button>
    <button class="tb" data-l="es">ES</button><button class="tb" data-l="en">EN</button><button class="tb" data-l="ar">عربي</button>
  </div>
</header>

<main>
  <!-- INICIO -->
  <section class="card" id="vStart">
    <h1 data-i="title"></h1>
    <label class="f" data-i="f_name"></label><input class="txt" id="iName" autocomplete="off">
    <label class="f" data-i="f_group"></label><input class="txt" id="iGroup" autocomplete="off" placeholder="3º ESO ...">
    <h2 style="margin-top:18px" data-i="rules_t"></h2>
    <ul class="rules" id="rules"></ul>
    <button class="btn green" id="bStart" data-i="start"></button>
    <p class="small" id="startMsg"></p>
  </section>

  <!-- PREGUNTAS -->
  <section id="vExam" hidden>
    <div class="qnav" id="qnav"></div>
    <div class="card" id="qcard"></div>
    <div class="nav">
      <button class="btn ghost" id="bPrev" data-i="prev"></button>
      <button class="btn" id="bNext" data-i="next"></button>
      <button class="btn green" id="bFinish" data-i="finish"></button>
    </div>
  </section>

  <!-- RESULTADO -->
  <section class="card" id="vRes" hidden>
    <h1 data-i="res_t"></h1>
    <div class="res-grade" id="rGrade"></div>
    <table id="rInfo"></table>
    <h2 style="margin-top:16px" data-i="res_q"></h2>
    <table id="rTable"></table>
    <p style="text-align:center;margin-top:18px"><button class="btn green" id="bPdf" data-i="pdf"></button></p>
    <p class="small" style="text-align:center" data-i="pdf_hint"></p>
    <div id="pdfBox" hidden style="text-align:center;background:#ecfdf5;border:2px solid #6ee7b7;border-radius:14px;padding:10px;margin-top:8px">
      <p style="margin:0 0 6px" data-i="pdf_alt"></p><a id="pdfLink" target="_blank" rel="noopener" style="font-weight:900"></a>
      <p style="margin:10px 0 0"><button class="btn ghost" id="bPrint" data-i="print"></button></p>
    </div>
  </section>
</main>

<div id="calc" hidden>
  <div id="cexpr"></div><div id="cdisp">0</div>
  <div class="ck" id="ck"></div>
</div>
<div class="warnbar" id="warn" hidden></div>
<div class="overlay" id="dlg" hidden><div class="card"><h2 id="dlgMsg"></h2><input class="txt" id="dlgIn" hidden style="margin:8px auto;display:block;text-align:center"><p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn ghost" id="dlgNo"></button><button class="btn green" id="dlgYes"></button></p></div></div>
<div class="overlay" id="back" hidden><div class="card"><h2 data-i="back_t"></h2><p data-i="back_p"></p><button class="btn" id="bBack" data-i="back_b"></button></div></div>

/* ---------- Azar con semilla ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Dibujo ---------- */
const KEYS = Object.keys(DATA);
function viewSegs(k, v, mirror) {
  const P = DATA[k], n = P.n, off = (v === 'planta') ? 0 : n;
  return P[v].map(s => { let [x1, y1, x2, y2] = s; y1 += off; y2 += off; if (mirror) { x1 = n - x1; x2 = n - x2; } return [x1, y1, x2, y2]; });
}
function canon(segs) {
  return segs.map(s => { const a = [s[0], s[1]].map(v => v.toFixed(2)).join(','), b = [s[2], s[3]].map(v => v.toFixed(2)).join(','); return a < b ? a + ';' + b : b + ';' + a; }).sort().join('|');
}
function viewSVG(segs, n) {
  const c = 100 / n; let g = '';
  for (let i = 1; i < n; i++) g += `<line x1="${i * c}" y1="0" x2="${i * c}" y2="100" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 2"/><line x1="0" y1="${i * c}" x2="100" y2="${i * c}" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 2"/>`;
  g += `<rect x="0" y="0" width="100" height="100" fill="none" stroke="#cbd5e1" stroke-width="1"/>`;
  for (const s of segs) g += `<line x1="${s[0] * c}" y1="${s[1] * c}" x2="${s[2] * c}" y2="${s[3] * c}" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>`;
  return `<svg viewBox="-6 -6 112 112">${g}</svg>`;
}
function isoSVG(k, arrows = true) {
  const P = DATA[k], n = P.n, U = ISOV.u, V = ISOV.v;
  const pr = p => [p[0] * U[0] + p[1] * U[1] + p[2] * U[2], p[0] * V[0] + p[1] * V[1] + p[2] * V[2]];
  let us = [], vs = [];
  for (const x of [0, n]) for (const y of [0, n]) for (const z of [0, n]) { const q = pr([x, y, z]); us.push(q[0]); vs.push(q[1]); }
  const pad = 0.55 * n / 2, u0 = Math.min(...us) - pad, v0 = Math.min(...vs) - pad, w = Math.max(...us) - u0 + pad, h = Math.max(...vs) - v0 + pad;
  const sz = Math.max(w, h), cu = u0 - (sz - w) / 2, cv = v0 - (sz - h) / 2;
  let g = '';
  for (const [pts, sh] of P.faces) { const c = Math.round(sh * 0.86 + 20); g += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="rgb(${c},${c},${Math.min(255, c + 6)})" stroke="rgb(${c},${c},${Math.min(255, c + 6)})" stroke-width="0.02" stroke-linejoin="round"/>`; }
  for (const s of P.iso) g += `<line x1="${s[0]}" y1="${s[1]}" x2="${s[2]}" y2="${s[3]}" stroke="#0f172a" stroke-width="0.035" stroke-linecap="round"/>`;
  if (arrows) {
    const hh = n / 2, ar = (tip, frm, lab, col) => {
      const a = pr(frm), b = pr(tip), dx = b[0] - a[0], dy = b[1] - a[1], L2 = Math.hypot(dx, dy), ux = dx / L2, uy = dy / L2, hl = 0.16 * n / 2, hw = 0.09 * n / 2;
      const bx = b[0] - ux * hl, by = b[1] - uy * hl;
      return `<line x1="${a[0]}" y1="${a[1]}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${0.05 * n / 2}" stroke-linecap="round"/>` +
        `<polygon points="${b[0]},${b[1]} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}" fill="${col}"/>` +
        `<text x="${a[0] - ux * 0.16 * n / 2}" y="${a[1] - uy * 0.16 * n / 2 + 0.1 * n / 2}" text-anchor="middle" font-family="Nunito,Arial" font-weight="900" font-size="${0.3 * n / 2}" fill="${col}">${lab}</text>`;
    };
    g += ar([n + 0.06, hh, hh * 0.55], [n + 0.75 * n / 2, hh, hh * 0.55], 'A', '#1d4ed8');
    g += ar([hh, -0.06, hh * 0.55], [hh, -0.75 * n / 2, hh * 0.55], 'P', '#b91c1c');
  }
  return `<svg class="iso" viewBox="${cu} ${cv} ${sz} ${sz}">${g}</svg>`;
}

/* ---------- Generar examen ---------- */
const SCALES_RED = [[1, 20], [1, 25], [1, 50], [1, 100]];
const AMP = [[2, 1], [5, 1], [10, 1]];
const fmtS = s => s[0] + ':' + s[1];
function buildExam() {
  const Q = [];
  // 1) ¿Cuál es la vista?
  const pieces = shuffle(KEYS);
  const viewsOrder = shuffle(['alzado', 'alzado', 'planta', 'perfil', 'perfil', 'planta']);
  for (let i = 0; i < CONFIG.nVistas; i++) {
    const k = pieces[i], v = viewsOrder[i], n = DATA[k].n;
    const correct = viewSegs(k, v, false), ck = canon(correct);
    const cand = [], seen = new Set([ck]);
    const add = segs => { const c = canon(segs); if (!seen.has(c) && segs.length) { seen.add(c); cand.push(segs); } };
    for (const w of shuffle(['alzado', 'perfil', 'planta'])) if (w !== v) add(viewSegs(k, w, false));
    add(viewSegs(k, v, true));
    for (const o of shuffle(KEYS)) if (o !== k && DATA[o].n === n) add(viewSegs(o, v, false));
    const opts = shuffle([{ segs: correct, ok: true }, ...cand.slice(0, 3).map(s => ({ segs: s, ok: false }))]);
    Q.push({ type: 'view', k, v, n, opts, ans: null });
  }
  // 2) ¿Qué pieza es?
  for (let i = 0; i < CONFIG.nIdent; i++) {
    const k = pieces[CONFIG.nVistas + i], n = DATA[k].n;
    const others = shuffle(KEYS.filter(o => o !== k && DATA[o].n === n && ['alzado', 'perfil', 'planta'].map(w => canon(viewSegs(o, w))).join('#') !== ['alzado', 'perfil', 'planta'].map(w => canon(viewSegs(k, w))).join('#'))).slice(0, 2);
    const opts = shuffle([{ k, ok: true }, ...others.map(o => ({ k: o, ok: false }))]);
    Q.push({ type: 'ident', k, n, opts, ans: null });
  }
  // 3) Escalas
  const allS = shuffle([[1, 1], ...SCALES_RED, [1, 200], ...AMP]);
  const s1 = allS[0];
  Q.push({ type: 'stype', s: s1, sol: s1[0] === s1[1] ? 'nat' : (s1[0] < s1[1] ? 'red' : 'amp'), ans: null });
  const s2 = pick(SCALES_RED), obj = pick(['o_mesa', 'o_puerta', 'o_cama', 'o_hab', 'o_coche']), d2 = pick([2, 3, 4, 5, 6, 8]);
  Q.push({ type: 'num', kind: 'q_real', s: s2, obj, d: d2, unit: 'cm', sol: d2 * s2[1], ans: '' });
  const s3 = pick(AMP), obj3 = pick(['o_torn', 'o_chip', 'o_eng', 'o_pila']), r3 = pick([3, 4, 5, 6, 8]);
  Q.push({ type: 'num', kind: 'q_draw', s: s3, obj: obj3, r: r3, unit: 'mm', sol: r3 * s3[0], ans: '' });
  const s4 = pick([[1, 50000], [1, 100000], [1, 200000]]), d4 = pick([4, 6, 8, 10, 12, 15]);
  Q.push({ type: 'num', kind: 'q_map', s: s4, d: d4, unit: 'km', sol: d4 * s4[1] / 100000, ans: '' });
  return Q;
}

  }
  el.innerHTML = h;
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const a = b.dataset.a; q.ans = isNaN(+a) ? a : +a; save(); renderQ(); });
  const ni = document.getElementById('numIn'); if (ni) ni.oninput = () => { q.ans = ni.value.trim(); save(); renderNav(); };
  renderNav();
}
function isRight(q) {
  if (q.type === 'view' || q.type === 'ident') return q.ans !== null && q.opts[q.ans].ok;
  if (q.type === 'stype') return q.ans === q.sol;

document.getElementById('bBack').onclick = () => { document.getElementById('back').hidden = true; document.getElementById('warn').hidden = true; goFull(); };
function goFull() { const d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().catch(() => {}); }
// Bloqueos básicos
['contextmenu', 'copy', 'cut', 'dragstart'].forEach(ev => document.addEventListener(ev, e => { if (S.started && !S.finished) e.preventDefault(); }));
document.addEventListener('keydown', e => {
  if (!S.started || S.finished) return;
  const k = e.key.toLowerCase();
  if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && ['c', 'u', 'p', 's', 'f'].includes(k)) || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
});

/* ---------- Calculadora ---------- */
let cx = '';
const CK = ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', ',', '⌫', '+', 'C', '(', ')', '='];
document.getElementById('ck').innerHTML = CK.map(k => `<button class="${'÷×−+'.includes(k) ? 'op' : k === '=' ? 'eq' : k === 'C' ? 'cl' : ''}">${k}</button>`).join('');
document.getElementById('ck').onclick = e => {
  const k = e.target.textContent; if (!e.target.matches('button')) return;
  const disp = document.getElementById('cdisp'), ex = document.getElementById('cexpr');
  if (k === 'C') { cx = ''; ex.textContent = ''; }
  else if (k === '⌫') cx = cx.slice(0, -1);
  else if (k === '=') {
    try {
      const js = cx.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-').replace(/,/g, '.');
      if (!/^[0-9+\-*/(). ]+$/.test(js)) throw 0;
      let r = Function('"use strict";return (' + js + ')')(); r = Math.round(r * 1e8) / 1e8;
      ex.textContent = cx + ' ='; cx = String(r).replace('.', ',');
    } catch (err) { ex.textContent = 'Error'; cx = ''; }
  } else cx += k;
  disp.textContent = cx || '0';
};
document.getElementById('calcBtn').onclick = () => { const c = document.getElementById('calc'); c.hidden = !c.hidden; };

/* ---------- Ventana de diálogo propia (los confirm/alert del navegador pueden estar bloqueados) ---------- */
function ask(msg, { yes = '✔ OK', no = null, input = false } = {}) {
  return new Promise(res => {
    const d = document.getElementById('dlg'), inp = document.getElementById('dlgIn'), bn = document.getElementById('dlgNo'), by = document.getElementById('dlgYes');
    document.getElementById('dlgMsg').innerHTML = md(msg); inp.hidden = !input; inp.value = ''; bn.hidden = !no; bn.innerHTML = md(no || ''); by.innerHTML = md(yes); d.hidden = false;
    by.onclick = () => { d.hidden = true; res(input ? inp.value : true); };
    bn.onclick = () => { d.hidden = true; res(input ? null : false); };
  });
}

/* ---------- Inicio, fin y resultado ---------- */
function startExam() {
  const name = document.getElementById('iName').value.trim(), group = document.getElementById('iGroup').value.trim();
  if (name.length < 3 || !group) { document.getElementById('startMsg').innerHTML = md(T('need')); return; }
  const seed = (now() ^ [...name].reduce((a, c) => Math.imul(a, 31) + c.charCodeAt(0) | 0, 7)) >>> 0;
  R = rng(seed);
  S = { started: true, finished: false, name, group, seed, start: now(), exits: [], lang: L, Q: buildExam() };
  save(); goFull(); showExam();
}
function showExam() {
  document.getElementById('vStart').hidden = true; document.getElementById('vRes').hidden = true; document.getElementById('vExam').hidden = false;
  ['timer', 'calcBtn'].forEach(id => document.getElementById(id).hidden = false);
  cur = 0; renderQ(); startTick(); updateChips();
}
async function finish(force) {
  if (!force) {
    const miss = S.Q.filter(q => !answered(q)).length;
    if (!(await ask(miss ? T('confirm', { n: miss }) : T('confirm0'), { yes: T('yes'), no: T('no') }))) return;
  }
  S.finished = true; S.end = now(); S.score = S.Q.filter(isRight).length; S.grade = Math.round(S.score / S.Q.length * 100) / 10;
  save(); clearInterval(tick); updateChips();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.getElementById('calc').hidden = true; document.getElementById('calcBtn').hidden = true;
  showRes();
}
function code() { const s = `${S.name}|${S.group}|${S.seed}|${S.score}|${S.start}|${S.end}|${S.exits.length}`; let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(7, '0'); }
const qType = q => q.type === 'view' ? 'Vista: ' + ({ alzado: 'alzado', perfil: 'perfil izq.', planta: 'planta' })[q.v] : q.type === 'ident' ? 'Vistas -> pieza' : q.type === 'stype' ? 'Tipo de escala ' + fmtS(q.s) : ({ q_real: 'Escala: medida real', q_draw: 'Escala: ampliación', q_map: 'Escala: mapa' })[q.kind];
function showRes() { document.getElementById('vStart').hidden = true; document.getElementById('vExam').hidden = true; document.getElementById('vRes').hidden = false; document.getElementById('timer').hidden = false; renderRes(); }
function renderRes() {
  document.getElementById('rGrade').textContent = String(S.grade).replace('.', ',') + ' / 10';
  const rows = [[T('i_name'), S.name], [T('i_group'), S.group], [T('i_date'), new Date(S.start).toLocaleDateString('es-ES')],
    [T('i_start'), hhmm(S.start)], [T('i_end'), hhmm(S.end)], [T('i_time'), dur(S.end - S.start)], [T('i_exits'), S.exits.length], [T('i_code'), code()]];
  document.getElementById('rInfo').innerHTML = rows.map(r => `<tr><td class="l">${md(r[0])}</td><td>${String(r[1]).replace(/</g, '&lt;')}</td></tr>`).join('');
  document.getElementById('rTable').innerHTML = `<tr><th>${md(T('c_q'))}</th><th>${md(T('c_type'))}</th><th>${md(T('c_res'))}</th></tr>` +
    S.Q.map((q, i) => `<tr><td>${i + 1}</td><td class="l" dir="ltr">${qType(q)}</td><td class="${isRight(q) ? 'ok' : 'ko'}">${isRight(q) ? '✔' : '✘'}</td></tr>`).join('');
}
/* ---------- PDF propio (sin librerías externas) ---------- */
function MiniPDF() {
  const ops = [], K = 72 / 25.4, H = 297;
  const lat = t => String(t).normalize('NFC').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[^\x20-\x7E\xA0-\xFF]/g, '?').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const col = c => c.map(v => (v / 255).toFixed(3)).join(' ');
  return {
    text(x, y, t, size = 11, bold = false, c = [15, 23, 42]) { ops.push(`BT ${col(c)} rg /${bold ? 'F2' : 'F1'} ${size} Tf ${(x * K).toFixed(2)} ${((H - y) * K).toFixed(2)} Td (${lat(t)}) Tj ET`); },
    line(x1, y1, x2, y2, c = [203, 213, 225], w = 0.3) { ops.push(`${col(c)} RG ${(w * K).toFixed(2)} w ${(x1 * K).toFixed(2)} ${((H - y1) * K).toFixed(2)} m ${(x2 * K).toFixed(2)} ${((H - y2) * K).toFixed(2)} l S`); },
    rect(x, y, w, h, c) { ops.push(`${col(c)} rg ${(x * K).toFixed(2)} ${((H - y - h) * K).toFixed(2)} ${(w * K).toFixed(2)} ${(h * K).toFixed(2)} re f`); },
    save(name) {
      const content = ops.join('\n');
      const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
        '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
        `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
      let out = '%PDF-1.4\n', off = [];
      objs.forEach((o, i) => { off.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
      const xr = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
      const bytes = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      const box = document.getElementById('pdfBox'); box.hidden = false;
      const l = document.getElementById('pdfLink'); l.href = url; l.download = name; l.textContent = '📥 ' + name;
    }
  };
}
function pdf() {
  const d = MiniPDF(); let y = 22;
  d.rect(0, 0, 210, 14, [30, 58, 138]); d.text(12, 9.5, 'Examen - Vistas y escalas - Tecnología y Digitalización 3º ESO', 12, true, [255, 255, 255]);
  d.text(12, y + 6, 'Nota: ' + String(S.grade).replace('.', ',') + ' / 10', 22, true); d.text(130, y + 6, `Aciertos: ${S.score} de ${S.Q.length}`, 12, true, [71, 85, 105]);
  y += 18;
  const info = [['Nombre', S.name], ['Grupo', S.group], ['Fecha', new Date(S.start).toLocaleDateString('es-ES')], ['Hora de inicio', hhmm(S.start)], ['Hora de fin', hhmm(S.end)],
    ['Tiempo empleado', dur(S.end - S.start) + ' (min:seg)'], ['Idioma usado', { es: 'Español', en: 'Inglés', ar: 'Árabe' }[S.lang] || S.lang], ['Salidas del examen', String(S.exits.length)], ['Código de control', code()]];
  for (const [a, b] of info) { d.text(12, y, a + ':', 11, true); d.text(60, y, b, 11); y += 6.5; }
  if (S.exits.length) {
    y += 2; d.text(12, y, 'Registro de salidas del examen:', 11, true, [153, 27, 27]); y += 6;
    S.exits.slice(0, 10).forEach((e, i) => { d.text(16, y, `${i + 1}. ${hhmm(e.t)} - ${e.kind} - tiempo fuera ${dur(e.d)}`, 10, false, [153, 27, 27]); y += 5.5; });
    if (S.exits.length > 10) { d.text(16, y, `... y ${S.exits.length - 10} más`, 10, false, [153, 27, 27]); y += 5.5; }
  }
  y += 5; d.text(12, y, 'Preguntas', 12, true); y += 3; d.line(12, y, 198, y, [30, 58, 138], 0.5);
  S.Q.forEach((q, i) => {
    y += 7; const ok = isRight(q);
    d.text(14, y, `${i + 1}.`, 10.5, true); d.text(24, y, qType(q), 10.5);
    const ans = q.type === 'num' ? (q.ans === '' ? '-' : q.ans + ' ' + q.unit) + `   (correcta: ${String(q.sol).replace('.', ',')} ${q.unit})` : q.type === 'stype' ? (q.ans ? { nat: 'Natural', red: 'Reducción', amp: 'Ampliación' }[q.ans] : '-') + `   (correcta: ${{ nat: 'Natural', red: 'Reducción', amp: 'Ampliación' }[q.sol]})` : (q.ans === null ? 'sin responder' : 'opción ' + 'ABCD'[q.ans]) + `   (correcta: ${'ABCD'[q.opts.findIndex(o => o.ok)]})`;
    d.text(88, y, ans, 10.5); d.text(184, y, ok ? 'BIEN' : 'MAL', 10.5, true, ok ? [22, 163, 74] : [220, 38, 38]);
    d.line(12, y + 2.4, 198, y + 2.4);
  });
  d.text(12, 288, 'Carlos Alberto Toledo - PDF generado automáticamente al terminar el examen', 8.5, false, [100, 116, 139]);
  d.save(`examen-vistas-escalas_${S.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_')}.pdf`);
}
document.getElementById('bPdf').onclick = pdf;
document.getElementById('bPrint').onclick = () => window.print();
document.getElementById('bStart').onclick = startExam;
document.getElementById('bPrev').onclick = () => { if (cur > 0) { cur--; renderQ(); } };
document.getElementById('bNext').onclick = () => { if (cur < S.Q.length - 1) { cur++; renderQ(); } };
document.getElementById('bFinish').onclick = () => finish(false);
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => applyLang(b.dataset.l));

/* ---------- Arranque ---------- */
(function init() {
  const qs = new URLSearchParams(location.search);
  if (qs.has('reset')) { history.replaceState(null, '', location.pathname); ask('🔑 PIN del profesor', { input: true, no: 'Cancelar' }).then(p => { if (p === CONFIG.pin) { try { localStorage.removeItem(CONFIG.storeKey); } catch (e) {} location.reload(); } }); }
  load();
  applyLang(S.lang || 'es');
  if (S.started && !S.finished) { R = rng(S.seed); S.exits.push({ t: now(), kind: 'recarga de la página', d: 0 }); save(); document.getElementById('back').hidden = false; showExam(); }
  else if (S.finished) showRes();
})();
</script>
